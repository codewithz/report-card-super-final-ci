# Runs the tests on GitHub's computers for every push to main
# and every pull request. A red X on a PR means a test failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install PHP 8.4 (same as the lab PCs)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer packages
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Make a .env file and an app key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test