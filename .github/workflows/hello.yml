name: Hello

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello from a GitHub computer. ${{ github.actor }} pushed ${{ github.sha }}"

      - name: Look around the machine
        run: |
          whoami
          head -2 /etc/os-release
          php --version | head -1
          ls

      - name: Get my code
        uses: actions/checkout@v4

      - name: Look again
        run: ls